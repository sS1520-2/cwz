name: Enable GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  pages: write

jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - name: Publish from main root
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -u
          repo="${{ github.repository }}"
          echo "Enabling Pages: deploy from branch main, folder /"
          gh api --method POST "repos/${repo}/pages" \
            --input - <<'JSON'
          {"build_type":"legacy","source":{"branch":"main","path":"/"}}
          JSON
          gh api "repos/${repo}/pages" --jq '{html_url:.html_url,status:.status,build_type:.build_type,source:.source}'
